<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>최고의 인재를 찾아라! Smart Swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Serif+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#fbe8ce;
    --board-dark:#f5d9ab;
    --board-line: rgba(42,35,26,0.05);
    --paper:#fffaf0;
    --paper-shadow: rgba(150,105,40,0.22);
    --ink:#2a231a;
    --ink-soft:#6b5f49;
    --stamp-red:#d94a3a;
    --stamp-teal:#1f9e79;
    --gold:#ffffff;
    --paper-line: rgba(42,35,26,0.10);
    --font-body:'Noto Serif KR', serif;
    --font-display:'Black Han Sans', sans-serif;
    --font-mono:'Nanum Gothic Coding', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,214,150,0.65), transparent 45%),
      radial-gradient(circle at 90% 95%, rgba(255,183,140,0.4), transparent 50%),
      repeating-linear-gradient(0deg, var(--board-line) 0px, var(--board-line) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, var(--board-line) 0px, var(--board-line) 1px, transparent 1px, transparent 26px),
      linear-gradient(160deg, var(--board), var(--board-dark));
    font-family: var(--font-body);
    color: var(--ink);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:64vh;
    display:flex;
    flex-direction:column;
    padding:18px 16px 24px;
    position:relative;
    overflow:hidden;
  }
  #app.shake{ animation: shakeScreen .28s ease; }
  @media (min-width: 700px){
    #app.admin-mode{ max-width: 960px; }
  }
  @keyframes shakeScreen{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-5px);}
    40%,60%{transform:translateX(5px);}
  }
  .screen{display:none; flex-direction:column; flex:1; min-height: calc(64vh - 42px); animation: fadeIn .4s ease; position:relative;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- shared ---------- */
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    color: rgba(42,35,26,0.55);
    text-transform:uppercase;
  }
  .case-title{
    font-family:var(--font-display);
    font-size:52px;
    line-height:1.2;
    color:var(--ink);
    margin:10px 0 4px;
    letter-spacing:-.01em;
    text-shadow: 3px 3px 0 rgba(42,35,26,0.12), 6px 6px 0 rgba(42,35,26,0.06);
    transform: rotate(-1.5deg);
  }
  .title-accent{
    color: var(--stamp-teal);
    -webkit-text-stroke: 1.5px var(--ink);
  }
  .divider-thread{
    height:2px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 10px);
    opacity:.55;
    margin: 14px 0;
  }
  button{font-family:var(--font-display); cursor:pointer; border:none;}
  .btn-primary{
    background: var(--gold);
    color: var(--ink);
    font-size:17px;
    padding:15px 20px;
    border-radius:3px;
    border: 2.5px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    transition: transform .12s ease;
  }
  .btn-primary:active{ transform: translateY(4px); box-shadow:0 0px 0 var(--ink); }

  /* ---------- INTRO ---------- */
  #screen-intro{ justify-content:flex-start; align-items:center; text-align:center; padding-top:14vh; }
  .intro-center{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .intro-center .eyebrow{ font-size:13px; letter-spacing:.22em; color: var(--ink-soft); }

  /* ---------- GAME ---------- */
  .game-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .round-counter{
    font-family:var(--font-mono);
    font-size:13px;
    color: rgba(42,35,26,0.7);
  }
  .round-counter b{color:var(--ink); font-size:15px;}

  .pinboard{
    display:flex; align-items:center; justify-content:space-between;
    margin: 6px 2px 14px;
    position:relative;
    height:16px;
  }
  .pinboard::before{
    content:"";
    position:absolute; left:0; right:0; top:50%;
    height:1px; background: rgba(42,35,26,0.18);
  }
  .pin{
    width:9px; height:9px; border-radius:50%;
    background: rgba(42,35,26,0.25);
    border:1px solid rgba(42,35,26,0.35);
    position:relative; z-index:1;
    transition: background .25s, border-color .25s, transform .25s;
  }
  .pin.done-trust{ background:var(--stamp-teal); border-color:var(--stamp-teal); }
  .pin.done-suspect{ background:var(--stamp-red); border-color:var(--stamp-red); }
  .pin.current{ transform:scale(1.6); background:#ffffff; border-color:var(--ink); border-width:2px; }

  .gauge-wrap{ margin-bottom:16px; position:relative; }
  .gauge-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    color:rgba(42,35,26,0.55); margin-bottom:6px; display:flex; justify-content:space-between;
  }
  .gauge-bar{
    height:8px; border-radius:5px; background: rgba(0,0,0,0.35);
    overflow:hidden; border:1px solid rgba(42,35,26,0.15);
    position:relative;
  }
  .gauge-fill{
    height:100%; width:50%;
    background: linear-gradient(90deg, var(--stamp-red), #ffffff, var(--stamp-teal));
    transition: width .4s ease;
  }
  .gauge-flash{
    position:absolute; inset:-4px; border-radius:8px;
    opacity:0; pointer-events:none;
  }
  .gauge-flash.good{ box-shadow:0 0 0 3px rgba(111,209,189,0.9); animation: flashPulse .5s ease; }
  .gauge-flash.bad{ box-shadow:0 0 0 3px rgba(224,122,106,0.9); animation: flashPulse .5s ease; }
  @keyframes flashPulse{ 0%{opacity:1;} 100%{opacity:0;} }

  .card-stage{
    position:relative;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:270px;
    margin-bottom: 8px;
  }

  .card{
    position:relative;
    width:85%;
    max-width:360px;
    min-height:300px;
    background: var(--paper);
    border-radius:4px;
    box-shadow: 0 18px 30px var(--paper-shadow), 0 2px 0 rgba(0,0,0,0.2);
    padding: 22px 18px 18px;
    touch-action: none;
    user-select:none;
    cursor:grab;
    z-index:2;
    display:flex;
    flex-direction:column;
    background-image: repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 29px);
    background-position: 0 96px;
  }
  .card:active{cursor:grabbing;}
  .card-pin{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #e56a5a, var(--stamp-red));
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
    z-index:3;
  }
  .card-portrait-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 4;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:10px;
    box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    border: 2px solid rgba(42,35,26,0.25);
    background: #d8c9a0;
  }
  .card-portrait-wrap img,
  .card-portrait-wrap svg{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .card-portrait-wrap.talking::after{
    content:"";
    position:absolute; inset:0;
    border-radius:6px;
    animation: talkGlow 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes talkGlow{
    0%,100%{ box-shadow: inset 0 0 0 2px rgba(239,139,44,0.18); }
    50%{ box-shadow: inset 0 0 0 3px rgba(239,139,44,0.65); }
  }
  .rec-tag{
    position:absolute; top:8px; left:8px;
    display:flex; align-items:center; gap:4px;
    background: rgba(17,23,15,0.55);
    color: rgba(255,250,240,0.9);
    font-family: var(--font-mono);
    font-size:9px;
    letter-spacing:.06em;
    padding: 3px 7px;
    border-radius: 3px;
    z-index:2;
  }
  .rec-dot{
    width:5px; height:5px; border-radius:50%;
    background: var(--stamp-red);
    animation: recBlink 1.1s ease-in-out infinite;
  }
  @keyframes recBlink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .card-role{
    font-family: var(--font-mono);
    font-size:11.5px;
    color: var(--ink-soft);
    border-bottom: 1px dashed rgba(42,35,26,0.3);
    padding-bottom:10px;
    margin-bottom:12px;
  }
  .card-question{
    font-family: var(--font-body);
    font-weight:700;
    font-size:15.5px;
    color: var(--ink);
    line-height:1.55;
    margin-bottom:12px;
  }
  .card-question::before{ content:"Q. "; color:var(--ink); }
  .card-answer{
    font-family: var(--font-body);
    font-size:14.5px;
    line-height:1.75;
    color: var(--ink);
    flex:1;
  }
  .card-answer::before{ content:"\201C"; }
  .card-answer::after{ content:"\201D"; }

  .stamp{
    position:absolute;
    font-family: var(--font-display);
    font-size:30px;
    letter-spacing:.06em;
    padding: 6px 16px;
    border:4px solid;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    z-index:4;
    mix-blend-mode: multiply;
  }
  .stamp-suspect{ top:26px; left:14px; color:var(--stamp-red); border-color:var(--stamp-red); transform: rotate(-18deg) scale(0.8); }
  .stamp-trust{ top:26px; right:14px; color:var(--stamp-teal); border-color:var(--stamp-teal); transform: rotate(14deg) scale(0.8); }

  .decision-buttons{ display:flex; gap:12px; }
  .btn{
    flex:1; padding:16px 10px; border-radius:8px; font-size:17px; letter-spacing:.05em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-arrow-icon{ width:20px; height:20px; flex-shrink:0; }
  .btn-suspect{ background: var(--stamp-red); color:#fff; border:none; box-shadow: 0 3px 0 rgba(120,40,30,0.4); }
  .btn-trust{ background: var(--stamp-teal); color:#fff; border:none; box-shadow: 0 3px 0 rgba(20,80,60,0.4); }

  /* ---------- VERDICT (dramatic ending) ---------- */
  #screen-verdict{ justify-content:center; align-items:center; text-align:center; position:relative; }
  .verdict-stage{ width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; }
  .verdict-line{
    font-family: var(--font-mono); font-size:15px; letter-spacing:.2em;
    color: rgba(42,35,26,0.75); opacity:0; transition: opacity .5s ease; margin-bottom:6px;
  }
  .verdict-line.show{ opacity:1; }
  .verdict-line.hide{ opacity:0; }
  .verdict-stampwrap{ margin: 10px 0 18px; }
  .verdict-stamp{
    font-family: var(--font-display);
    font-size:108px;
    line-height:1;
    padding: 6px 30px;
    border:7px solid currentColor;
    border-radius:18px;
    display:inline-block;
    opacity:0;
  }
  .verdict-stamp.slam{ animation: stampSlam .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes stampSlam{
    0%{ transform: scale(4) rotate(-30deg); opacity:0; }
    55%{ transform: scale(0.85) rotate(-6deg); opacity:1; }
    75%{ transform: scale(1.1) rotate(-10deg); }
    100%{ transform: scale(1) rotate(-8deg); opacity:1; }
  }
  .verdict-details{ opacity:0; transition: opacity .6s ease; width:100%; padding: 0 6px; }
  .verdict-details.show{ opacity:1; }
  .grade-card{
    background: var(--paper);
    border-radius:14px;
    padding:26px 20px 20px;
    margin-bottom:26px;
    box-shadow: 0 14px 30px rgba(150,105,40,0.22), 0 2px 0 rgba(42,35,26,0.06);
    border: 1px solid rgba(42,35,26,0.08);
  }
  .vtitle{
    font-family:var(--font-display);
    font-size:36px;
    color:var(--ink);
    margin:0 0 16px;
    line-height:1.25;
    letter-spacing:-.01em;
    text-shadow: 2px 2px 0 rgba(42,35,26,0.1);
  }
  .vdesc{
    font-size:15.5px;
    line-height:1.85;
    color: var(--ink);
    margin: 0 0 20px;
    text-align:center;
  }
  .result-stats{ display:flex; justify-content:center; gap:26px; margin: 4px 0 0; }
  .stat{ text-align:center; }
  .stat-num{ font-family:var(--font-display); font-size:28px; color:var(--ink); }
  .stat-label{ font-family:var(--font-mono); font-size:11px; color:rgba(42,35,26,0.55); margin-top:2px; }

  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .confetti-piece{
    position:absolute; top:-14px; width:7px; height:13px; opacity:.95; border-radius:1px;
    animation-name: confettiFall; animation-timing-function: linear; animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    from{ transform: translateY(-10px) rotate(0deg); opacity:1; }
    to{ transform: translateY(112vh) rotate(420deg); opacity:0; }
  }

  .admin-link{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    font-family: var(--font-mono);
    font-size:11px;
    color: rgba(42,35,26,0.32);
    letter-spacing:.08em;
    padding:6px 10px;
    cursor:pointer;
  }
  .score-submit{
    margin-top:8px;
    padding-top:16px;
    border-top:1px dashed rgba(42,35,26,0.2);
    text-align:left;
  }
  .score-msg{
    font-size:14px;
    line-height:1.7;
    color: var(--ink);
    text-align:center;
    margin: 0 0 14px;
    font-weight:600;
  }
  .name-input{
    width:100%;
    padding:13px 14px;
    border-radius:5px;
    border: 1.5px solid rgba(42,35,26,0.25);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size:15px;
    margin-bottom:10px;
  }
  .name-input::placeholder{ color: rgba(107,95,73,0.65); }
  .name-input:focus{ outline:none; border-color: var(--stamp-teal); }
  .score-submitted-msg{
    text-align:center;
    font-size:14px;
    color: var(--stamp-teal);
    font-weight:700;
    padding:14px 0;
  }
  .btn-orange{
    background: #ef8b2c;
    color: #ffffff;
    border: 2.5px solid #b5641a;
    box-shadow: 0 4px 0 #b5641a;
  }
  .btn-orange:active{ transform: translateY(4px); box-shadow:0 0px 0 #b5641a; }

  /* ---------- ADMIN ---------- */
  #screen-admin-gate{ justify-content:center; align-items:center; text-align:center; }
  #screen-admin-panel{ padding-top:8px; }
  .admin-pw-input{
    width:100%;
    padding:14px;
    border-radius:5px;
    border: 1.5px solid rgba(42,35,26,0.25);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size:15px;
    margin: 18px 0 12px;
    text-align:center;
  }
  .admin-error{ font-size:12.5px; color: var(--stamp-red); margin-bottom:8px; min-height:16px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .admin-actions{ display:flex; gap:8px; margin-bottom:12px; }
  .admin-btn{
    flex:1;
    font-family: var(--font-mono);
    font-size:12px;
    padding:9px 8px;
    border-radius:4px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
  }
  .admin-table-wrap{
    flex:1;
    overflow:auto;
    border: 1.5px solid rgba(42,35,26,0.2);
    border-radius:6px;
    background: var(--paper);
  }
  table.admin-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.admin-table th, table.admin-table td{
    padding:9px 8px;
    border-bottom:1px solid rgba(42,35,26,0.12);
    text-align:left;
    white-space:nowrap;
  }
  table.admin-table th{
    font-family: var(--font-mono);
    font-size:11px;
    color: var(--ink-soft);
    position:sticky; top:0;
    background: var(--paper);
  }
  .admin-empty{ text-align:center; padding:30px 10px; color: var(--ink-soft); font-size:13px; }
  .q-summary{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .q-summary-item{
    background: var(--paper);
    border:1.5px solid rgba(42,35,26,0.15);
    border-radius:6px;
    padding:8px 4px;
    text-align:center;
  }
  .q-summary-item .qlabel{ font-family: var(--font-mono); font-size:10.5px; color: var(--ink-soft); }
  .q-summary-item .qpct{ font-family: var(--font-display); font-size:16px; color: var(--ink); margin-top:2px; }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background: rgba(42,35,26,0.2); border-radius:4px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ INTRO ============ -->
  <section id="screen-intro" class="screen active">
    <div class="intro-center">
      <div class="eyebrow">SMART SWIPE</div>
      <h1 class="case-title">최고의 인재를<br><span class="title-accent">찾아라!</span></h1>
    </div>
    <div style="width:100%; margin-top:36px;">
      <button class="btn-primary" style="width:100%;" onclick="startGame()">시작하기</button>
    </div>
    <div class="admin-link" onclick="openAdminGate()">관리자</div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <div class="game-header">
      <div class="eyebrow" id="codenameTag">SMART SWIPE · 최고의 인재를 찾아라!</div>
      <div class="round-counter">ROUND <b id="roundNow">1</b>/10</div>
    </div>
    <div class="pinboard" id="pinboard"></div>
    <div class="gauge-wrap">
      <div class="gauge-label"><span>판단 신뢰도</span><span id="gaugeNum">50</span></div>
      <div class="gauge-bar">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="gauge-flash" id="gaugeFlash"></div>
      </div>
    </div>
    <div class="card-stage">
      <div class="card" id="card">
        <div class="stamp stamp-suspect" id="stampSuspect">의심</div>
        <div class="stamp stamp-trust" id="stampTrust">신뢰</div>
        <div class="card-pin"></div>
        <div class="card-portrait-wrap talking" id="portraitWrap">
          <div class="rec-tag"><span class="rec-dot"></span>REC</div>
        </div>
        <div class="card-role" id="cardRole"></div>
        <div class="card-question" id="cardQuestion"></div>
        <div class="card-answer" id="cardAnswer"></div>
      </div>
    </div>
    <div class="decision-buttons">
      <button class="btn btn-suspect" onclick="decide('suspect')">
        <svg class="btn-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        <span>의심</span>
      </button>
      <button class="btn btn-trust" onclick="decide('trust')">
        <span>신뢰</span>
        <svg class="btn-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ VERDICT (dramatic ending) ============ -->
  <section id="screen-verdict" class="screen">
    <div class="verdict-stage">
      <div class="verdict-line" id="vLine1">탐색 종료</div>
      <div class="verdict-line" id="vLine2"></div>
      <div class="verdict-details" id="verdictDetails" style="display:none;">
        <div class="grade-card">
          <div class="verdict-stampwrap" id="verdictStampWrap" style="display:none;">
            <div class="verdict-stamp" id="verdictStampLetter">S</div>
          </div>
          <h2 class="vtitle" id="vTitle"></h2>
          <p class="vdesc" id="vDesc"></p>
          <div class="result-stats">
            <div class="stat"><div class="stat-num" id="vStatSpies">0</div><div class="stat-label">부적합 발견</div></div>
          </div>
        </div>

        <div class="score-submit" id="scoreSubmit">
          <p class="score-msg">여러분들의 스코어를 기록해주세요.<br>이름을 남겨주신 모든 분들에게 선물을 드립니다.</p>
          <input type="text" id="nameInput" class="name-input" placeholder="실명을 적어주세요.">

/* ---------------- avatar (abstract silhouette "talking" portrait) ---------------- */
const AV_INK = '#2a231a';
const AV_TINTS = ['#d8c9a0','#b9c4b0','#c7b2a3','#a9bcc4','#cbb8cf'];
const AV_MAP = { 1:[0,2], 2:[1,4], 3:[2,0], 4:[3,1], 5:[4,3], 6:[1,0], 7:[3,4], 8:[0,1], 9:[2,3], 10:[4,2] };
function avHair(variant){
  switch(variant){
    case 1: return '<path d="M24 40 a26 26 0 0 1 52 0 v6 h-52 z" fill="'+AV_INK+'"/>';
    case 2: return '<path d="M22 40 a28 28 0 0 1 56 0 v20 h-8 v-14 h-40 v14 h-8 z" fill="'+AV_INK+'"/>';
    case 3: return '<path d="M22 42 a28 28 0 0 1 40 -22 a28 28 0 0 1 16 22 v4 h-56 z" fill="'+AV_INK+'"/>';
    case 4: return '<path d="M24 40 a26 26 0 0 1 52 0 v2 h-52 z" fill="'+AV_INK+'"/><circle cx="50" cy="24" r="7" fill="'+AV_INK+'"/>';
    default: return '';
  }
}
function buildAvatarSVG(id){
  const combo = AV_MAP[id] || [0,0];
  const bg = AV_TINTS[combo[0]];
  const hair = avHair(combo[1]);
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">'
    + '<rect x="0" y="0" width="100" height="100" fill="' + bg + '"/>'
    + '<circle cx="50" cy="58" r="30" fill="' + AV_INK + '"/>'
    + hair
    + '<ellipse cx="39" cy="52" rx="3.4" ry="4.6" fill="' + bg + '"/>'
    + '<ellipse cx="61" cy="52" rx="3.4" ry="4.6" fill="' + bg + '"/>'
    + '<ellipse cx="50" cy="68" rx="8" ry="3.4" fill="' + bg + '"/>'
    + '</svg>';
}
function renderPortrait(r){
  const wrap = document.getElementById('portraitWrap');
  wrap.innerHTML = '<div class="rec-tag"><span class="rec-dot"></span>REC</div>';
  const dataUri = PORTRAITS[r.id];
  if(dataUri){
    const img = document.createElement('img');
    img.src = dataUri;
    img.alt = r.role;
    img.onerror = function(){
      const holder = document.createElement('div');
      holder.style.width = '100%';
      holder.style.height = '100%';
      holder.innerHTML = buildAvatarSVG(r.id);
      wrap.replaceChild(holder, img);
    };
    wrap.appendChild(img);
  } else {
    const holder = document.createElement('div');
    holder.style.width = '100%';
    holder.style.height = '100%';
    holder.innerHTML = buildAvatarSVG(r.id);
    wrap.appendChild(holder);
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('app').classList.toggle('admin-mode', id === 'screen-admin-panel' || id === 'screen-admin-gate');
}

/* ---------------- audio (tiny synthesized sfx, no assets) ---------------- */
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol||0.15, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function sfxTick(good){ tone(good ? 900 : 200, 0.12, good ? 'triangle' : 'sawtooth', 0.12); }
function sfxStamp(){ tone(85, 0.4, 'square', 0.28); tone(55, 0.45, 'sine', 0.22, 0.03); }
function sfxDrumroll(){ for(let i=0;i<10;i++){ tone(140 + Math.random()*50, 0.06, 'square', 0.05, i*0.085); } }
function sfxChime(good){
  if(good){ tone(660,0.15,'sine',0.15); tone(880,0.2,'sine',0.15,0.12); }
  else { tone(180,0.3,'sawtooth',0.15); tone(120,0.35,'sawtooth',0.12,0.08); }
}

/* ---------------- pinboard ---------------- */
function buildPinboard(){
  const pb = document.getElementById('pinboard');
  pb.innerHTML = '';
  for(let i=0;i<ROUNDS.length;i++){
    const p = document.createElement('div');
    p.className = 'pin';
    p.id = 'pin-'+i;
    pb.appendChild(p);
  }
}

/* ---------------- game flow ---------------- */
function startGame(){
  ensureAudio();
  verdictTimers.forEach(t=>clearTimeout(t));
  verdictTimers = [];

  order = ROUNDS.slice();
  idx = 0;
  gauge = 50;
  history = [];
  falsePositive = 0;
  falseNegative = 0;
  locked = false;
  sessionStartTime = Date.now();
  scoreSubmittedThisSession = false;
  currentSessionKey = 'session-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  logSessionStart();

  buildPinboard();
  updateGauge();
  renderRound();
  showScreen('screen-game');
}

function updateGauge(){
  gauge = Math.max(0, Math.min(100, gauge));
  document.getElementById('gaugeFill').style.width = gauge + '%';
  document.getElementById('gaugeNum').textContent = gauge;
}

function renderRound(){
  if(idx >= order.length){ endGame(false); return; }
  const r = order[idx];
  document.getElementById('roundNow').textContent = idx+1;
  renderPortrait(r);
  document.getElementById('cardRole').textContent = r.role;
  document.getElementById('cardQuestion').textContent = r.question;
  document.getElementById('cardAnswer').textContent = r.answer;

  cardEl = document.getElementById('card');
  cardEl.style.transition = 'none';
  cardEl.style.transform = 'translate(0px,0px) rotate(0deg)';
  document.getElementById('stampSuspect').style.opacity = 0;
  document.getElementById('stampTrust').style.opacity = 0;

  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('current'));
  const curPin = document.getElementById('pin-'+idx);
  if(curPin) curPin.classList.add('current');

  attachDrag();
}

function attachDrag(){
  cardEl.onpointerdown = (e)=>{
    if(locked) return;
    dragging = true;
    startX = e.clientX;
    cardEl.style.transition = 'none';
    cardEl.setPointerCapture(e.pointerId);
  };
  cardEl.onpointermove = (e)=>{
    if(!dragging || locked) return;
    curX = e.clientX - startX;
    const rot = curX/18;
    cardEl.style.transform = 'translate(' + curX + 'px, ' + (Math.abs(curX)*0.05) + 'px) rotate(' + rot + 'deg)';
    const ratio = Math.min(Math.abs(curX)/140, 1);
    if(curX < 0){
      document.getElementById('stampSuspect').style.opacity = ratio;
      document.getElementById('stampTrust').style.opacity = 0;
    } else {
      document.getElementById('stampTrust').style.opacity = ratio;
      document.getElementById('stampSuspect').style.opacity = 0;
    }
  };
  cardEl.onpointerup = ()=>{
    if(!dragging || locked) return;
    dragging = false;
    if(curX <= -110){ decide('suspect'); }
    else if(curX >= 110){ decide('trust'); }
    else {
      cardEl.style.transition = 'transform .3s ease';
      cardEl.style.transform = 'translate(0px,0px) rotate(0deg)';
      document.getElementById('stampSuspect').style.opacity = 0;
      document.getElementById('stampTrust').style.opacity = 0;
    }
    curX = 0;
  };
}

function flashGauge(good){
  const el = document.getElementById('gaugeFlash');
  el.className = 'gauge-flash ' + (good ? 'good' : 'bad');
  requestAnimationFrame(()=>{ void el.offsetWidth; });
  setTimeout(()=>{ el.className = 'gauge-flash'; }, 500);
}

function decide(direction){
  if(locked) return;
  locked = true;
  const r = order[idx];
  const isCorrect = (direction === r.correct);

  if(isCorrect){ gauge += 10; } else { gauge -= 15; }
  if(!isCorrect){
    if(direction === 'trust') falsePositive++;
    else falseNegative++;
  }
  updateGauge();
  flashGauge(isCorrect);
  sfxTick(isCorrect);

  history.push({ id:r.id, chosen:direction, correct:r.correct, isCorrect });

  const pin = document.getElementById('pin-'+idx);
  if(pin) pin.classList.remove('current');
  if(pin) pin.classList.add(direction === 'trust' ? 'done-trust' : 'done-suspect');

  cardEl.style.transition = 'transform .35s ease';
  const flyX = direction === 'trust' ? 600 : -600;
  const flyRot = direction === 'trust' ? 24 : -24;
  cardEl.style.transform = 'translate(' + flyX + 'px, 40px) rotate(' + flyRot + 'deg)';
  document.getElementById(direction === 'trust' ? 'stampTrust' : 'stampSuspect').style.opacity = 1;

  setTimeout(()=>{
    locked = false;
    if(gauge <= 0){ endGame(true); return; }
    idx++;
    renderRound();
  }, 380);
}

/* ---------------- grading ---------------- */
function calcGrade(spiesCaught, spiesTotal, realProtected, realTotal, collapsed){
  const totalCaughtRight = spiesCaught + realProtected;
  const totalPlayed = spiesTotal + realTotal;

  if(collapsed){
    return { tier:'F', color:'var(--stamp-red)', title:'중도 탈락',
      desc: '다시 한 번 일하는 방식을 확인해보시면 어떨까요?' };
  }
  if(spiesCaught === spiesTotal && realProtected === realTotal){
    return { tier:'S', color:'var(--ink)', title:'가치 헌터',
      desc: '일하는 방식에 적합한 인재를 모두 찾았습니다!' };
  }
  if(totalCaughtRight >= totalPlayed - 1){
    return { tier:'A', color:'#1f9e79', title:'예리한 눈',
      desc: '예리한 눈으로 적합한 인재를 찾았지만, 몇 명은 놓치고 말았습니다.' };
  }
  if(totalCaughtRight >= totalPlayed * 0.6){
    return { tier:'B', color:'var(--ink-soft)', title:'절반의 성공',
      desc: '많은 인재를 놓쳤네요. 하지만 준수하게 판별해냈습니다.' };
  }
  if(spiesCaught < realProtected){
    return { tier:'C', color:'#e0a15f', title:'흔들린 눈',
      desc: '그럴듯한 답변에 마음을 쉽게 놓았군요.' };
  }
  if(realProtected < spiesCaught){
    return { tier:'C', color:'#e0a15f', title:'지나치게 엄격한 눈',
      desc: '일하는 방식을 실천하는 인재를 여러 번 오해했군요.' };
  }
  return { tier:'D', color:'var(--stamp-red)', title:'실패',
    desc: '다시 한 번 일하는 방식을 확인해보시면 어떨까요?' };
}

/* ---------------- dramatic ending sequence ---------------- */
function endGame(collapsed){
  let spiesCaught = 0, spiesTotal = 0, realProtected = 0, realTotal = 0;
  history.forEach(h=>{
    const rr = ROUNDS.find(x=>x.id === h.id);
    if(rr.type === 'fail'){ spiesTotal++; if(h.isCorrect) spiesCaught++; }
    else { realTotal++; if(h.isCorrect) realProtected++; }
  });
  const finalGauge = gauge;
  const grade = calcGrade(spiesCaught, spiesTotal, realProtected, realTotal, collapsed);

  const totalPlayed = spiesTotal + realTotal;
  const totalCorrect = spiesCaught + realProtected;
  const playSeconds = Math.max(0, Math.round((Date.now() - sessionStartTime) / 1000));
  const perRound = history.map(h => ({ id: h.id, correct: h.isCorrect }));
  lastSessionStats = {
    startedAt: new Date(sessionStartTime).toISOString(),
    playSeconds: playSeconds,
    totalPlayed: totalPlayed,
    totalCorrect: totalCorrect,
    accuracyPct: totalPlayed > 0 ? Math.round((totalCorrect / totalPlayed) * 100) : 0,
    grade: grade.title,
    collapsed: collapsed,
    perRound: perRound
  };
  autoLogSession();

  showScreen('screen-verdict');

  const app = document.getElementById('app');
  const vLine1 = document.getElementById('vLine1');
  const vLine2 = document.getElementById('vLine2');
  const stampWrap = document.getElementById('verdictStampWrap');
  const stampLetter = document.getElementById('verdictStampLetter');
  const details = document.getElementById('verdictDetails');
  const titleEl = document.getElementById('vTitle');
  const descEl = document.getElementById('vDesc');
  const statSpies = document.getElementById('vStatSpies');

  // reset
  vLine1.textContent = collapsed ? '탐색 중단' : '탐색 종료';
  vLine1.className = 'verdict-line';
  vLine2.textContent = '';
  vLine2.className = 'verdict-line';
  stampWrap.style.display = 'none';
  stampLetter.className = 'verdict-stamp';
  stampLetter.style.background = 'transparent';
  stampLetter.style.boxShadow = 'none';
  details.style.display = 'none';
  details.className = 'verdict-details';
  document.getElementById('confettiLayer').innerHTML = '';

  // reset score submission UI for this new result
  document.getElementById('nameInput').value = '';
  document.getElementById('scoreSubmit').style.display = 'block';
  document.getElementById('scoreSubmittedMsg').style.display = 'none';
  document.getElementById('scoreError').textContent = '';
  const submitBtn = document.getElementById('submitScoreBtn');
  submitBtn.disabled = false;
  submitBtn.textContent = '스코어 제출하기';
  scoreSubmittedThisSession = false;

  verdictTimers.push(setTimeout(()=>{ vLine1.classList.add('show'); sfxDrumroll(); }, 100));

  verdictTimers.push(setTimeout(()=>{
    vLine2.textContent = '적합도 분석 중...';
    vLine2.classList.add('show');
  }, 700));

  verdictTimers.push(setTimeout(()=>{
    vLine1.classList.add('hide');
    vLine2.classList.add('hide');
  }, 1500));

  verdictTimers.push(setTimeout(()=>{
    details.style.display = 'block';
    requestAnimationFrame(()=>details.classList.add('show'));
    titleEl.textContent = grade.title;
    descEl.innerHTML = grade.desc.replace(/\.\s+/g, '.<br>');

    stampWrap.style.display = 'block';
    stampLetter.textContent = grade.tier;
    stampLetter.style.color = grade.color;
    stampLetter.style.background = (grade.tier === 'S') ? '#ffffff' : 'transparent';
    stampLetter.style.boxShadow = (grade.tier === 'S') ? '0 6px 18px rgba(150,105,40,0.25)' : 'none';
    stampLetter.classList.add('slam');
    app.classList.add('shake');
    sfxStamp();
    setTimeout(()=>app.classList.remove('shake'), 300);

    sfxChime(!collapsed && (grade.tier === 'S' || grade.tier === 'A'));
    countUp(statSpies, spiesCaught, 600);
    const good = !collapsed && (grade.tier === 'S' || grade.tier === 'A');
    spawnConfetti(good);
  }, 1900));
}

function countUp(el, target, duration){
  const stepTime = 16;
  const steps = Math.max(1, Math.round(duration/stepTime));
  const inc = target/steps;
  let cur = 0;
  const timer = setInterval(()=>{
    cur += inc;
    if(cur >= target){ cur = target; clearInterval(timer); }
    el.textContent = Math.round(cur);
  }, stepTime);
}

function spawnConfetti(good){
  const layer = document.getElementById('confettiLayer');
  const goodColors = ['#ef8b2c','#1f9e79','#fffaf0'];
  const badColors = ['#9c2b1f','#5b5140','#3a2f22'];
  const colors = good ? goodColors : badColors;
  const count = good ? 34 : 20;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + '%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.animationDelay = (Math.random()*0.6) + 's';
    piece.style.width = (5 + Math.random()*4) + 'px';
    piece.style.height = (9 + Math.random()*8) + 'px';
    layer.appendChild(piece);
  }
  setTimeout(()=>{ layer.innerHTML = ''; }, 5200);
}

/* ---------------- score submission (Cloudflare Pages Functions backend) ---------------- */
function buildRecord(name){
  return {
    name: name,
    status: 'completed',
    startedAt: lastSessionStats.startedAt,
    submittedAt: new Date().toISOString(),
    playSeconds: lastSessionStats.playSeconds,
    accuracyPct: lastSessionStats.accuracyPct,
    totalCorrect: lastSessionStats.totalCorrect,
    totalPlayed: lastSessionStats.totalPlayed,
    grade: lastSessionStats.grade,
    collapsed: lastSessionStats.collapsed,
    perRound: lastSessionStats.perRound
  };
}

async function postRecord(key, record){
  const res = await fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: key, record: record })
  });
  if(!res.ok) throw new Error('HTTP_' + res.status);
  return res.json();
}

/* Logged the moment a play session begins. If the player closes the tab
   before reaching an ending, this record is never overwritten and shows
   up in the dashboard as a mid-game dropout ("중도이탈"). */
async function logSessionStart(){
  if(!currentSessionKey) return;
  try{
    await postRecord(currentSessionKey, {
      name: null,
      status: 'in_progress',
      startedAt: new Date(sessionStartTime).toISOString(),
      submittedAt: new Date().toISOString()
    });
  } catch(e){
    console.error('session start log error:', e);
  }
}

/* Every finished session (reached an ending) overwrites the in-progress
   record with the full result, marking it as completed. */
async function autoLogSession(){
  if(!lastSessionStats || !currentSessionKey) return;
  try{
    await postRecord(currentSessionKey, buildRecord('N/A'));
  } catch(e){
    console.error('auto log error:', e);
  }
}

async function submitScore(){
  if(scoreSubmittedThisSession) return;
  const input = document.getElementById('nameInput');
  const errEl = document.getElementById('scoreError');
  const btn = document.getElementById('submitScoreBtn');
  errEl.textContent = '';

  const name = input.value.trim();
  if(!name){
    input.style.borderColor = 'var(--stamp-red)';
    input.focus();
    errEl.textContent = '이름을 입력해주세요.';
    setTimeout(()=>{ input.style.borderColor = ''; }, 1200);
    return;
  }
  if(!lastSessionStats || !currentSessionKey){
    errEl.textContent = '결과 정보를 찾을 수 없습니다. 다시 플레이해주세요.';
    return;
  }

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = '제출 중...';

  try{
    await postRecord(currentSessionKey, buildRecord(name));
    scoreSubmittedThisSession = true;
    document.getElementById('scoreSubmit').style.display = 'none';
    document.getElementById('scoreSubmittedMsg').style.display = 'block';
  } catch(e){
    console.error('score submit error:', e);
    errEl.textContent = '제출에 실패했습니다. 잠시 후 다시 시도해주세요.';
  } finally {
    if(!scoreSubmittedThisSession){
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }
}

/* ---------------- admin panel (Cloudflare Pages Functions backend) ---------------- */
function openAdminGate(){
  document.getElementById('adminPasswordInput').value = '';
  document.getElementById('adminError').textContent = '';
  showScreen('screen-admin-gate');
}

async function adminLogin(){
  const val = document.getElementById('adminPasswordInput').value;
  const errEl = document.getElementById('adminError');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/logs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val })
    });
    if(res.status === 401){
      errEl.textContent = '비밀번호가 올바르지 않습니다.';
      return;
    }
    if(!res.ok) throw new Error('HTTP_' + res.status);
    const data = await res.json();
    adminPasswordCache = val;
    document.getElementById('adminPasswordInput').value = '';
    showScreen('screen-admin-panel');
    renderAdmin(data.records || []);
  } catch(e){
    console.error('admin login error:', e);
    errEl.textContent = '로그인 중 오류가 발생했습니다. 다시 시도해주세요.';
  }
}

function formatDateTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch(e){ return iso || '-'; }
}
function formatDuration(sec){
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + '분 ' + (s < 10 ? '0' + s : s) + '초';
}

async function loadAdminLogs(){
  const wrap = document.getElementById('adminTableWrap');
  wrap.innerHTML = '<div class="admin-empty">불러오는 중...</div>';
  if(!adminPasswordCache){
    openAdminGate();
    return;
  }
  try{
    const res = await fetch('/api/logs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPasswordCache })
    });
    if(res.status === 401){
      adminPasswordCache = null;
      openAdminGate();
      document.getElementById('adminError').textContent = '세션이 만료되었습니다. 다시 로그인해주세요.';
      return;
    }
    if(!res.ok) throw new Error('HTTP_' + res.status);
    const data = await res.json();
    renderAdmin(data.records || []);
  } catch(e){
    console.error('admin load error:', e);
    wrap.innerHTML = '<div class="admin-empty">로그를 불러올 수 없습니다.<br>잠시 후 다시 시도해주세요.</div>';
  }
}

function renderAdmin(rows){
  rows.sort((a, b) => new Date(b.submittedAt || b.startedAt) - new Date(a.submittedAt || a.startedAt));
  adminRowsCache = rows;
  renderQuestionSummary(rows);
  renderAdminTable(rows);
}

function renderQuestionSummary(rows){
  const el = document.getElementById('adminSummary');
  if(!rows || rows.length === 0){ el.innerHTML = ''; return; }

  const completedRows = rows.filter(r => r.status === 'completed');
  const dropoutCount = rows.length - completedRows.length;

  const totals = {};
  const corrects = {};
  ROUNDS.forEach(r => { totals[r.id] = 0; corrects[r.id] = 0; });
  completedRows.forEach(r=>{
    (r.perRound || []).forEach(pr=>{
      if(totals[pr.id] == null) return;
      totals[pr.id]++;
      if(pr.correct) corrects[pr.id]++;
    });
  });

  let html = '<div class="q-summary" style="grid-template-columns:repeat(3,1fr); margin-bottom:10px;">'
    + '<div class="q-summary-item"><div class="qlabel">총 접속</div><div class="qpct">' + rows.length + '</div></div>'
    + '<div class="q-summary-item"><div class="qlabel">완료</div><div class="qpct">' + completedRows.length + '</div></div>'
    + '<div class="q-summary-item"><div class="qlabel">중도이탈</div><div class="qpct">' + dropoutCount + '</div></div>'
    + '</div>';

  html += '<div class="q-summary">';
  for(let id = 1; id <= 10; id++){
    const t = totals[id] || 0;
    const c = corrects[id] || 0;
    const pct = t > 0 ? Math.round((c / t) * 100) : 0;
    html += '<div class="q-summary-item"><div class="qlabel">Q' + id + '</div><div class="qpct">' + (t > 0 ? pct + '%' : '-') + '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderAdminTable(rows){
  const wrap = document.getElementById('adminTableWrap');
  if(!rows || rows.length === 0){
    wrap.innerHTML = '<div class="admin-empty">아직 접속 기록이 없습니다.</div>';
    return;
  }
  let html = '<table class="admin-table"><thead><tr>'
    + '<th>접속 시간</th><th>플레이타임</th><th>최종 등급</th><th>총 정답</th><th>이름</th>';
  for(let id = 1; id <= 10; id++){ html += '<th>Q' + id + '</th>'; }
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    const isDropout = r.status !== 'completed';
    const perRoundMap = {};
    (r.perRound || []).forEach(pr => { perRoundMap[pr.id] = pr.correct; });
    html += '<tr>'
      + '<td>' + formatDateTime(r.startedAt) + '</td>'
      + '<td>' + formatDuration(r.playSeconds) + '</td>'
      + '<td>' + (isDropout ? '중도이탈' : escapeHtml(r.grade || '-')) + '</td>'
      + '<td>' + (isDropout ? '-' : (r.totalCorrect != null ? r.totalCorrect + '/' + r.totalPlayed : '-')) + '</td>'
      + '<td>' + escapeHtml(r.name || 'N/A') + '</td>';
    for(let id = 1; id <= 10; id++){
      const v = perRoundMap[id];
      html += '<td>' + (v === undefined ? '-' : (v ? 'O' : 'X')) + '</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function exportAdminCSV(){
  const wrap = document.getElementById('adminTableWrap');
  if(!adminRowsCache || adminRowsCache.length === 0){
    wrap.innerHTML = '<div class="admin-empty">내보낼 기록이 없습니다.</div>';
    return;
  }
  const header = ['접속시간','플레이타임(초)','최종등급','총정답','총문항','이름'];
  for(let id = 1; id <= 10; id++){ header.push('Q' + id); }
  const lines = [header.join(',')];
  adminRowsCache.forEach(r=>{
    const isDropout = r.status !== 'completed';
    const perRoundMap = {};
    (r.perRound || []).forEach(pr => { perRoundMap[pr.id] = pr.correct; });
    const row = [
      formatDateTime(r.startedAt),
      r.playSeconds,
      isDropout ? '중도이탈' : (r.grade || ''),
      isDropout ? '' : r.totalCorrect,
      isDropout ? '' : r.totalPlayed,
      '"' + String(r.name || 'N/A').replace(/"/g, '""') + '"'
    ];
    for(let id = 1; id <= 10; id++){
      const v = perRoundMap[id];
      row.push(v === undefined ? '' : (v ? 'O' : 'X'));
    }
    lines.push(row.join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'smartswipe-log.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
